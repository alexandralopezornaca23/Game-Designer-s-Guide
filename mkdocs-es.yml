site_name: Guía de herramientas de arte para videojuegos
site_description: >-
  Atajos, herramientas e interfaz de los programas que uso para hacer videojuegos.
site_author: Alexandra López Ornaca
copyright: © Alexandra López Ornaca · Content CC BY 4.0
site_url: https://alexandralopezornaca23.github.io/Game-Designer-s-Guide/es/
docs_dir: docs/es
site_dir: site/es

theme:
  name: material
  language: es
  icon:
    logo: material/palette-swatch-outline
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

# El selector de idioma de la cabecera (el icono del globo terráqueo).
extra:
  alternate:
    - name: English
      link: /Game-Designer-s-Guide/
      lang: en
    - name: Español
      link: /Game-Designer-s-Guide/es/
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.details

plugins:
  # Los nombres de herramienta están en inglés en las dos versiones, así que el
  # índice de búsqueda se construye para los dos idiomas en ambos sitios.
  - search:
      lang:
        - en
        - es

