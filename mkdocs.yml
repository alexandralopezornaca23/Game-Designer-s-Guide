# GENERATED BY generate.py — do not hand-edit the nav: section
# (the rest of the file can be edited, but it is overwritten on regeneration)
site_name: Game Art Tools Reference
site_description: >-
  Shortcuts, tools and interface reference for Blender, ZBrush, Maya, Krita,
  Unity, Unreal Engine and more — searchable across every program at once.
site_author: Alexandra López Ornaca
copyright: © Alexandra López Ornaca · Game Design & Development artist

theme:
  name: material
  language: en
  icon:
    logo: material/palette-swatch-outline
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.details

plugins:
  # The interface is English, the entries are written in Spanish, so the search
  # index is built for both.
  - search:
      lang:
        - en
        - es

extra_css:
  - assets/extra.css

